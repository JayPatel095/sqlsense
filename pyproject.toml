[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlsense"
dynamic = ["version"]
description = "Explains SQL query plans in plain English and tells you exactly what index to add"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "psycopg2-binary>=2.9",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sqlsense = "sqlsense.cli:main"

[tool.setuptools.packages.find]
include = ["sqlsense*"]

# version lives only in sqlsense/__init__.py
[tool.setuptools.dynamic]
version = {attr = "sqlsense.__version__"}
