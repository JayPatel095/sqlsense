[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlsense"
dynamic = ["version"]
description = "Explains SQL query plans in plain English and tells you exactly what index to add"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "psycopg2-binary>=2.9",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16", "mypy>=2.3"]

[project.scripts]
sqlsense = "sqlsense.cli:main"

[tool.setuptools.packages.find]
include = ["sqlsense*"]

# version lives only in sqlsense/__init__.py
[tool.setuptools.dynamic]
version = {attr = "sqlsense.__version__"}

# ruff covers both lint and format; target version is inferred from
# project.requires-python, so it stays correct if that floor moves.
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
